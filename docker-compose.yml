services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financeiro_app
    restart: unless-stopped
    volumes:
      - .:/var/www
    networks:
      - financeiro_network

  nginx:
    image: nginx:alpine
    container_name: financeiro_nginx
    restart: unless-stopped
    ports:
      - "8099:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - financeiro_network

networks:
  financeiro_network:
    driver: bridge
