services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financeiro_app
    restart: unless-stopped
    volumes:
      - .:/var/www
    networks:
      - financeiro_network
    environment:
      # Em local, manter como php-fpm puro. No Render, ENTRYPOINT ajusta para nginx.
      APP_ENV: local

  nginx:
    image: nginx:alpine
    container_name: financeiro_nginx
    restart: unless-stopped
    ports:
      - "5082:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - financeiro_network

  mysql:
    image: mysql:8.0
    container_name: financeiro_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - financeiro_network

volumes:
  mysql_data:

networks:
  financeiro_network:
    driver: bridge
